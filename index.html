<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-lang-mode="bilingual">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智觉 · NOETIC SENSE — Cognitive Prosthesis for Human–ASI Symbiosis</title>
    <meta
      name="description"
      content="智觉（Noetic Sense / Intellect-Sense）：将超级智能（ASI）高维隐性推演转化为人类直觉捕捉的物理信号与心理共鸣。基于 Three.js 与 WebGPU (TSL Compute) 的交互式四维感知架构与认知义体设计专著。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <!-- Fixed Full-Viewport Three.js WebGPU + TSL Sensory Field -->
    <div id="webgpu-stage-wrap" class="webgpu-stage-wrap" aria-hidden="true">
      <canvas id="noetic-webgpu-canvas"></canvas>
      <div class="atmospheric-vignette"></div>
      <div class="paper-grain-overlay"></div>
    </div>

    <!-- Architectural Top Navigation Bar -->
    <header class="top-bar" id="top-bar">
      <div class="top-bar-inner">
        <a href="#sec-hero" class="brand-identity" id="nav-brand-home">
          <span class="brand-cn">智觉</span>
          <span class="brand-sep">/</span>
          <span class="brand-en">NOETIC SENSE</span>
        </a>

        <nav class="primary-nav" aria-label="Monograph Chapters">
          <a href="#sec-foundation" id="nav-link-foundation" class="nav-item">
            <span class="nav-num">I</span>
            <span class="nav-zh-label">哲学基石</span>
            <span class="nav-en-label">Foundation</span>
          </a>
          <a href="#sec-dimensions" id="nav-link-dimensions" class="nav-item">
            <span class="nav-num">II</span>
            <span class="nav-zh-label">四维架构</span>
            <span class="nav-en-label">4D Studio</span>
          </a>
          <a href="#sec-hardware" id="nav-link-hardware" class="nav-item">
            <span class="nav-num">III</span>
            <span class="nav-zh-label">形态校准</span>
            <span class="nav-en-label">Calibration</span>
          </a>
          <a href="#sec-prototypes" id="nav-link-prototypes" class="nav-item">
            <span class="nav-num">IV</span>
            <span class="nav-zh-label">原型推演</span>
            <span class="nav-en-label">Prototypes</span>
          </a>
          <a href="#sec-ethics" id="nav-link-ethics" class="nav-item">
            <span class="nav-num">V</span>
            <span class="nav-zh-label">留白伦理</span>
            <span class="nav-en-label">Negative Space</span>
          </a>
        </nav>

        <div class="utility-controls">
          <!-- Reading Language Mode Switcher -->
          <div class="segmented-switch" role="group" aria-label="Language Reading Mode">
            <button
              type="button"
              id="btn-lang-bilingual"
              class="seg-btn is-active"
              data-lang-mode="bilingual"
              title="Bilingual Parallel Edition (中英双语对照)"
            >
              双语
            </button>
            <button
              type="button"
              id="btn-lang-zh"
              class="seg-btn"
              data-lang-mode="zh"
              title="Chinese Edition (纯中文雅集)"
            >
              中文
            </button>
            <button
              type="button"
              id="btn-lang-en"
              class="seg-btn"
              data-lang-mode="en"
              title="English Edition"
            >
              EN
            </button>
          </div>

          <!-- Sub-Audible Neuro-Acoustic Synthesizer Toggle -->
          <button
            type="button"
            id="btn-audio-toggle"
            class="ctrl-btn"
            aria-pressed="false"
            title="Toggle Sub-Audible Harmonic Resonance (神经声学谐振)"
          >
            <span class="wave-bars" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
            <span id="audio-btn-label">声学静音 · Muted</span>
          </button>

          <!-- Obsidian / Archival Paper Theme Toggle -->
          <button
            type="button"
            id="btn-theme-toggle"
            class="ctrl-btn"
            aria-label="Switch Obsidian Dark or Rice-Paper Light Theme"
            title="Toggle Obsidian Void / Archival Rice-Paper"
          >
            <span id="theme-btn-label">宣纸 · Paper</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Subtle Fixed Bottom Telemetry Strip -->
    <aside class="gpu-telemetry-bar" aria-label="Real-time WebGPU Sensory Telemetry">
      <div class="telemetry-left">
        <span class="telemetry-key">ENGINE</span>
        <span class="telemetry-val" id="hud-gpu-backend">INITIALIZING WEBGPU...</span>
        <span class="telemetry-sep">·</span>
        <span class="telemetry-val" id="hud-compute-stats">4,096 TSL SPORES</span>
      </div>
      <div class="telemetry-right">
        <span class="telemetry-key">STATE</span>
        <span class="telemetry-val" id="hud-noetic-state">BAROMETRIC CALM · 留白待命</span>
      </div>
    </aside>

    <!-- Main Monograph & Interactive Sensory Experience -->
    <main id="app-root" class="monograph-main"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
